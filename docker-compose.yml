services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      ECO_TO_ALEXA_ACCOUNT_BIND: "0.0.0.0"
    volumes:
      - ec_to_alexa_data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  oauth:
    build: .
    command: ["python", "oauth_server.py"]
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      ECO_TO_ALEXA_OAUTH_BIND: "0.0.0.0"
    volumes:
      - ec_to_alexa_data:/data
    networks:
      - internal
    restart: unless-stopped

volumes:
  ec_to_alexa_data:

networks:
  internal:
    internal: true
