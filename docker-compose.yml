services:
  web:
    build: .
    ports:
      # 127.0.0.1 par défaut : l'accès public passe par Caddy en HTTPS.
      - "${EXPOSE_ADDR:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    volumes:
      - ec_to_alexa_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  oauth:
    build: .
    command: ["python", "oauth_server.py"]
    ports:
      - "${EXPOSE_ADDR:-127.0.0.1}:8001:8001"
    env_file:
      - .env
    volumes:
      - ec_to_alexa_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - oauth
    restart: unless-stopped

volumes:
  ec_to_alexa_data:
  caddy_data:
  caddy_config:
